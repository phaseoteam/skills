# Copy the published Phaseo skills from the Phaseo repository into skills/.
# The source of truth is phaseoteam/Phaseo: .agents/skills, published to apps/docs/.mintlify/skills
# by apps/docs/scripts/sync-skills.mjs (the same files https://phaseo.app/docs serves).
name: Sync skills from Phaseo

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the published skills from phaseoteam/Phaseo
        run: |
          git clone --filter=blob:none --sparse --no-checkout https://github.com/phaseoteam/Phaseo.git "$RUNNER_TEMP/phaseo"
          git -C "$RUNNER_TEMP/phaseo" sparse-checkout set apps/docs/.mintlify/skills
          git -C "$RUNNER_TEMP/phaseo" checkout main
          test -f "$RUNNER_TEMP/phaseo/apps/docs/.mintlify/skills/phaseo-gateway/SKILL.md"
          echo "SOURCE_SHA=$(git -C "$RUNNER_TEMP/phaseo" rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Replace skills/ with the published copy
        run: |
          rm -rf skills
          mkdir -p skills
          cp -R "$RUNNER_TEMP/phaseo/apps/docs/.mintlify/skills/." skills/

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- skills)" ]; then
            echo "Skills already match phaseoteam/Phaseo@$SOURCE_SHA."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A skills
          git commit -m "Sync skills from phaseoteam/Phaseo@$SOURCE_SHA"
          git push
